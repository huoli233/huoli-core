# 覆盖层：把我们自己这一版里不需要的账号、登录与模型供应商引导整块关掉
#
# 用法：huoli web --patch apps/web/overlays/qq-no-login.yml
#
# 只按 id 覆盖已有行，不动 apps/web 与 packages/client 的源码，
# 这样上游升级时不会与我们的改动冲突。
- id: ui-settings-account
  disabled: true

- id: account-controller
  disabled: true

# 模型供应商的首次配置引导也一起关：不再往页面里注入 __HUOLI_MODELS_ONBOARDING__
- id: ui-settings-models
  disabled: true
