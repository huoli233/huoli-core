# 把 QQ 机器人的零件挂进运行环境
- insert:
    - id: qq-attention
      name: '@huoli/huoli-qq-attention'

    - id: qq-subject
      name: '@huoli/huoli-qq-subject'

    - id: qq-memory
      name: '@huoli/huoli-qq-memory'

    - id: qq-pacing
      name: '@huoli/huoli-qq-pacing'

    - id: qq-material
      name: '@huoli/huoli-qq-material'

    - id: qq-proactive
      name: '@huoli/huoli-qq-proactive'
      config:
        enabled: false

    - id: qq-continuity
      name: '@huoli/huoli-qq-continuity'

    - id: qq-channel
      name: '@huoli/huoli-qq-channel'
      config:
        url: !!js process.env.QQ_ONEBOT_URL ?? 'ws://127.0.0.1:6700'
        selfId: !!js process.env.QQ_SELF_ID ?? ''
        accessToken: !!js process.env.QQ_ACCESS_TOKEN ?? ''

    - id: qq-vitals
      name: '@huoli/huoli-qq-vitals'

    - id: qq-self
      name: '@huoli/huoli-qq-self'
      config:
        enabled: false

    - id: qq-bundle
      name: '@huoli/huoli-qq-bundle'
      config:
        maxSteps: 40
        dailySweepHour: 4
        proactiveThrottleMs: 60000

# 中文比英文占 token 多，提前压一点；群聊要留更多最近的原话
- id: compaction-basic
  config:
    thresholdRatio: 0.72
    retainRatio: 0.25
