- id: agent-default-model
  name: '@huoli/huoli-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@huoli/huoli-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.HUOLI_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@huoli/huoli-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-executor-native
  disabled: false

- id: tool-executor-ptc
  disabled: true

- id: system-prompt
  name: '@huoli/huoli-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@huoli/huoli-cordis-host-runner'
      config:
        clientInspectTimeoutMs: 100
    - id: cordis-inspect-providers
      name: '@huoli/huoli-tool-cordis/host'
    - id: tool-cordis
      name: '@huoli/huoli-tool-cordis'
    - id: client-inspect-timeout-fixture
      name: ./client-fixture.mjs
