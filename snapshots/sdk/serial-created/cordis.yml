# TypeScript SDK snapshot-record patch over `huoli --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@huoli/huoli-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@huoli/huoli-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@huoli/huoli-session-persistence-jsonl'
  config:
    root: !!js huoliHomePath('sessions')
    compression: !!js "process.env.HUOLI_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@huoli/huoli-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

- id: session-log-deepseek
  name: '@huoli/huoli-session-log-deepseek'
  config:
    enabled: true

- insert:
    - id: serial-created-fixture
      name: '../../../packages/core/agent-loop/tests/fixtures/serial-created.mjs'
