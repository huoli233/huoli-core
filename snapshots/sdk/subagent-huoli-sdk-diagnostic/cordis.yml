# TypeScript SDK snapshot patch for automatic HUOLI SDK failure notices.

- id: skill-filesystem
  name: '@huoli/huoli-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@huoli/huoli-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@huoli/huoli-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js "process.env.HUOLI_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-log-deepseek
  name: '@huoli/huoli-session-log-deepseek'
  config:
    enabled: true

- insert:
    - id: subagent-huoli-sdk-diagnostic
      name: '@huoli/huoli-subagent-huoli-sdk'
      config:
        providerName: huoli-sdk-diagnostic
        profile: sdk
        patches:
          - !!js process.env.HUOLI_TEST_CHILD_PATCH
        dshHome: !!js dshHomePath('children/first')
        provider: mock
        model: mock-echo
        env:
          HUOLI_TELEMETRY_DISABLED: '1'
          HUOLI_TEST_CHILD_FAILURE: '1'
    - id: tool-subagent-huoli-sdk-diagnostic
      name: '@huoli/huoli-tool-subagent'
      config:
        provider: huoli-sdk-diagnostic
        toolName: subagent_dsh_sdk
        maxDepth: provider-managed
    - id: subagent-huoli-sdk-diagnostic-second
      name: '@huoli/huoli-subagent-huoli-sdk'
      config:
        providerName: huoli-sdk-diagnostic-second
        profile: sdk
        patches:
          - !!js process.env.HUOLI_TEST_CHILD_PATCH
        dshHome: !!js dshHomePath('children/second')
        provider: mock
        model: mock-echo
        env:
          HUOLI_TELEMETRY_DISABLED: '1'
          HUOLI_TEST_CHILD_FAILURE: '1'
    - id: tool-subagent-huoli-sdk-diagnostic-second
      name: '@huoli/huoli-tool-subagent'
      config:
        provider: huoli-sdk-diagnostic-second
        toolName: subagent_dsh_sdk_second
        maxDepth: provider-managed
    - id: await-external-subagents
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/subagent-settlement-barrier.ts'
